[project]
name = "onemeter-ha-integration"
version = "0.0.1"
description = "Home Assistant custom integration for OneMeter BLE energy-meter reader"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["custom_components"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
